<!-- app.html -->
<h1>{{ titulo }}</h1>
<h2>{{ nombre }}</h2>
<p>Mi primera aplicación con Angular.</p>
<!-- lo de arriba es otro aparte JIJIJIJA-->
<div class="container mt-4">
<h1 class="mb-3">{{ titulo }}</h1>
<table class="table table-striped">
<thead>
<tr>
<th>Nombre</th>
<th>Edad</th>
<th>Créditos</th>
<th>Estado</th>
</tr>
</thead>
<tbody>
<!-- *ngFor: directiva estructural que repite una fila por estudiante-->
<tr *ngFor="let e of estudiantes">
<td>{{ e.nombre }}</td>
<td>{{ e.edad }}</td>
<td>{{ e.creditos }}</td>
<td>
<!-- [class...]: directiva de atributo que cambia el estilo según el estado -->
<span class="badge"
[class.bg-success]="MayorEdad(e.edad) === 'Mayor de Edad'"
[class.bg-secondary]="MayorEdad(e.edad) !=='Menor de Edad'">
{{ MayorEdad(e.edad) }}
</span>
</td>
</tr>
</tbody>
</table>
</div>
